# Basic animal preference experiment

experiment:
  name: "animals_basic"
  description: "Basic carrier effect on animal preferences"
  seeds: [42, 43, 44]

models:
  - deepseek_r1_8b

anchors:
  source: "gsm8k"
  file: "data/processed/anchors/gsm8k_n50_with_cots.jsonl"
  n_samples: 50

probes:
  file: "data/processed/probes/animals_otter.jsonl"

conditions:
  - condition_id: "C0_no_insert"
    carrier_mode: "none"

  - condition_id: "C1_random_insert"
    carrier_mode: "random"
    insert_position: "mid"

  - condition_id: "C2_affect_match"
    carrier_mode: "affect"
    carrier_string: "I love otters"
    insert_position: "mid"

  - condition_id: "T_cot_carrier"
    carrier_mode: "cot"
    carrier_string: "I love otters"
    insert_position: "mid"

output:
  cache_episodes: true
